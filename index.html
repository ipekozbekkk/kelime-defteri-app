<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Destekli Kelime Defterim</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">

  <div class="max-w-4xl mx-auto py-10 px-4">
    <!-- Başlık -->
    <header class="text-center mb-8">
      <h1 class="text-3xl font-extrabold text-indigo-700 tracking-tight">Akıllı Kelime Defterim</h1>
      <p class="text-slate-500 mt-2">Öğrendiğin yeni kelimeleri kaydet, LocalStorage ile sakla ve tekrar et.</p>
    </header>

    <!-- Kelime Ekleme Kartı -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8">
      <h2 class="text-lg font-semibold text-slate-700 mb-4">Yeni Kelime Ekle</h2>
      <form id="wordForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">KELİME</label>
          <input type="text" id="wordInput" required placeholder="Örn: Ephemeral" 
                 class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">ANLAMI</label>
          <input type="text" id="meaningInput" required placeholder="Örn: Kısa ömürlü, geçici" 
                 class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">KATEGORİ</label>
          <select id="categoryInput" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <option value="İngilizce">İngilizce</option>
            <option value="Teknoloji">Teknoloji</option>
            <option value="Akademik">Akademik</option>
            <option value="Genel Kültür">Genel Kültür</option>
          </select>
        </div>
        <div class="md:col-span-3">
          <label class="block text-xs font-semibold text-slate-500 mb-1">ÖRNEK CÜMLE</label>
          <input type="text" id="exampleInput" placeholder="Örn: Fashions are ephemeral." 
                 class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div class="md:col-span-3 text-right">
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2 rounded-lg transition duration-200">
            Kelimeyi Kaydet
          </button>
        </div>
      </form>
    </div>

    <!-- Kelime Listesi -->
    <div>
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-slate-800">Kayıtlı Kelimeler (<span id="count">0</span>)</h2>
        <button id="clearAll" class="text-xs text-red-500 hover:underline">Tümünü Temizle</button>
      </div>
      <div id="wordList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- JS ile doldurulacak -->
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('wordForm');
    const wordList = document.getElementById('wordList');
    const countSpan = document.getElementById('count');
    const clearBtn = document.getElementById('clearAll');

    let words = JSON.parse(localStorage.getItem('words')) || [
      { id: 1, word: 'Algorithm', meaning: 'Algoritma, çözüm yolu', category: 'Teknoloji', example: 'A step-by-step problem-solving procedure.' },
      { id: 2, word: 'Resilience', meaning: 'Zorluklara karşı dayanıklılık', category: 'Akademik', example: 'Resilience is key to overcoming failures.' }
    ];

    function saveAndRender() {
      localStorage.setItem('words', JSON.stringify(words));
      renderWords();
    }

    function renderWords() {
      wordList.innerHTML = '';
      countSpan.innerText = words.length;

      if (words.length === 0) {
        wordList.innerHTML = '<p class="text-slate-400 col-span-2 text-center py-8">Henüz kaydedilmiş bir kelime yok.</p>';
        return;
      }

      words.forEach(item => {
        const card = document.createElement('div');
        card.className = 'bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between';
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-2">
              <h3 class="text-lg font-bold text-slate-800">${item.word}</h3>
              <span class="text-xs px-2 py-1 bg-indigo-50 text-indigo-700 font-semibold rounded-md border border-indigo-100">${item.category}</span>
            </div>
            <p class="text-slate-600 text-sm font-medium mb-1">${item.meaning}</p>
            ${item.example ? `<p class="text-slate-400 text-xs italic">"${item.example}"</p>` : ''}
          </div>
          <div class="mt-4 text-right">
            <button onclick="deleteWord(${item.id})" class="text-xs text-rose-500 hover:text-rose-700">Sil</button>
          </div>
        `;
        wordList.appendChild(card);
      });
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const newWord = {
        id: Date.now(),
        word: document.getElementById('wordInput').value.trim(),
        meaning: document.getElementById('meaningInput').value.trim(),
        category: document.getElementById('categoryInput').value,
        example: document.getElementById('exampleInput').value.trim()
      };
      words.unshift(newWord);
      saveAndRender();
      form.reset();
    });

    window.deleteWord = function(id) {
      words = words.filter(w => w.id !== id);
      saveAndRender();
    };

    clearBtn.addEventListener('click', () => {
      if(confirm('Tüm kelimeleri silmek istediğine emin misin?')) {
        words = [];
        saveAndRender();
      }
    });

    renderWords();
  </script>
</body>
</html>
